<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hex Color Picker</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="box">
  <svg class="arc-text" viewBox="0 0 160 80" width="150">
    <path id="curve" d="M 20,70 A 70,70 0 0,1 140,70" fill="none"/>
    <text font-size="14" fill="white" font-family="sans-serif" font-weight="500" letter-spacing="1">
      <textPath href="#curve" startOffset="50%" text-anchor="middle">Select a color</textPath>
    </text>
  </svg>
  <img src="color-palette.png" class="palette-icon" alt="Palette">
</div>
<span class="arrow">&#62;</span>

<h1>Hex Color Picker</h1>
<div class="container">
    <div id="palette"></div>
    <div class="info">
        <p>Selected color: <span id="color">None</span></p>
        <div id="preview"></div>
    </div>
</div>
<div>
    <button>Generate color</button>
    <div id="hiscolors"><h2>Colors history</h2></div>
</div>

<script src="script.js"></script>
</body>
</html>
